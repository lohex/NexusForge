version = 1

; Paths are relative to the project root (serving/serve_router.sh sets the CWD).
; Section names match the model IDs in opencode.json, without provider prefixes.
; Context is the total server capacity; OpenCode limits are per slot.
[*]
load-on-startup = false
jinja = true
flash-attn = on
parallel = 1
no-kv-unified = true
fit = on
fit-target = 512
reasoning = auto
top-p = 0.95
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 0.0
frequency-penalty = 0.0

; Matches serving/serve_qwen.sh default: 32K context with Q4_0 KV cache.
[qwen3.5-9b-orchestrator]
model = models/qwen/Qwen3.5-9B-Q4_K_M.gguf
ctx-size = 32768
cache-type-k = q4_0
cache-type-v = q4_0
temp = 0.6
top-k = 20

; Three parallel Granite workers with 32K context each.
[granite-4.2-3b-multi]
model = models/granite/granite-4.2-3b-Q4_K_M.gguf
n-gpu-layers = 999
ctx-size = 98304
parallel = 3
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-k = 0

; Matches serving/serve_granite_8b.sh; GPU layer count is fitted automatically.
[granite-4.2-8b-orchestrator]
model = models/granite/granite-4.2-8b-Q4_K_M.gguf
ctx-size = 16384
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-k = 0
n-predict = 8192

; Matches serving/serve_ornith.sh: 128K, Q4 KV, precise coding profile.
[ornith-1.5-9b-orchestrator]
model = models/ornith/Ornith-1.5-9B-Q4_K_M.gguf
ctx-size = 131072
cache-type-k = q4_0
cache-type-v = q4_0
temp = 0.6
top-k = 20
reasoning-budget = 4096
chat-template-kwargs = {"reasoning_effort": "medium"}

; Vision projector plus Q8 KV cache: the F16 cache exceeds 8 GiB at 32K.
; Leave GPU layers automatic so fit can adapt to available VRAM.
[qwen3-vl-4b-instruct]
model = models/qwen-vl-4b/Qwen3VL-4B-Instruct-Q4_K_M.gguf
mmproj = models/qwen-vl-4b/mmproj-Qwen3VL-4B-Instruct-F16.gguf
ctx-size = 32768
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0.0
presence-penalty = 1.5
n-predict = 4096

; Matches serving/serve_qwen_long_context.sh and config/qwen-long-context.env.
; This profile uses system RAM for its 512K KV cache.
[qwen3.5-4b-long-context]
model = models/qwen-long-context/Qwen3.5-4B-Q4_K_M.gguf
ctx-size = 524288
batch-size = 256
ubatch-size = 64
rope-scaling = yarn
rope-scale = 2.0
yarn-orig-ctx = 262144
cache-type-k = q4_0
cache-type-v = q4_0
no-kv-offload = true
fit-target = 768
temp = 0.8
top-k = 40
min-p = 0.05

; PrismML runtime only. Keep the six existing profiles identical to router-models.ini.
; Matches serving/serve_bonsai_2_27b.sh (32K per slot).
[bonsai-2-27b-ternary]
model = models/bonsai-2-27b/Ternary-Bonsai-2-27B-PTQ1_0.gguf
ctx-size = 32768
parallel = 1
cache-type-k = q4_0
cache-type-v = q4_0
fit-target = 768
batch-size = 512
ubatch-size = 128
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.05
repeat-penalty = 1.0
presence-penalty = 0.0
frequency-penalty = 0.0
chat-template-kwargs = {"reasoning_effort": "medium"}
