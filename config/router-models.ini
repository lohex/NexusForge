version = 1

; Paths are relative to the project root (serving/serve_router.sh sets the CWD).
; Section names match the model IDs in opencode.json, without provider prefixes.
; Context is the total server capacity; OpenCode limits are per slot.
[*]
load-on-startup = false
jinja = true
flash-attn = on
parallel = 1
no-kv-unified = true
fit = on
fit-target = 512
reasoning = auto
top-p = 0.95
min-p = 0.0
repeat-penalty = 1.0
presence-penalty = 0.0
frequency-penalty = 0.0

; Matches serving/serve_qwen.sh: 16K, Q8 KV, precise orchestrator profile.
[qwen3.5-9b-orchestrator]
model = models/qwen/Qwen3.5-9B-Q4_K_M.gguf
n-gpu-layers = 999
ctx-size = 16384
cache-type-k = q8_0
cache-type-v = q8_0
temp = 0.6
top-k = 20

; Three parallel Granite workers with 32K context each.
[granite-4.2-3b-multi]
model = models/granite/granite-4.2-3b-Q4_K_M.gguf
n-gpu-layers = 999
ctx-size = 98304
parallel = 3
cache-type-k = q4_0
cache-type-v = q4_0
temp = 1.0
top-k = 0

; Matches serving/serve_granite_8b.sh; GPU layer count is fitted automatically.
[granite-4.2-8b-orchestrator]
model = models/granite/granite-4.2-8b-Q4_K_M.gguf
ctx-size = 16384
cache-type-k = q8_0
cache-type-v = q8_0
temp = 1.0
top-k = 0
n-predict = 8192

; Matches serving/serve_ornith.sh: 128K, Q4 KV, precise coding profile.
[ornith-1.5-9b-orchestrator]
model = models/ornith/Ornith-1.5-9B-Q4_K_M.gguf
ctx-size = 131072
cache-type-k = q4_0
cache-type-v = q4_0
temp = 0.6
top-k = 20
reasoning-budget = 4096
chat-template-kwargs = {"reasoning_effort": "medium"}

; Matches serving/serve_qwen_long_context.sh and config/qwen-long-context.env.
; This profile uses system RAM for its 512K KV cache.
[qwen3.5-4b-long-context]
model = models/qwen-long-context/Qwen3.5-4B-Q4_K_M.gguf
ctx-size = 524288
batch-size = 256
ubatch-size = 64
rope-scaling = yarn
rope-scale = 2.0
yarn-orig-ctx = 262144
cache-type-k = q4_0
cache-type-v = q4_0
no-kv-offload = true
fit-target = 768
temp = 0.8
top-k = 40
min-p = 0.05
